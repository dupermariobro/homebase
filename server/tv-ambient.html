<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Homebase · Family</title>
<style>
  /* Ambient family screen for TVs + the wall tablet, in an "Ink" look:
     an editorial broadsheet on a warm sumi field — Shippori Mincho serif headline, IBM Plex
     body, a shu (vermilion) accent, hairline rules and open whitespace instead of boxes.
     Built for 10-foot reading, OLED-safe (dark, no static bright logo, the frame drifts a few
     px on a slow cycle, dims late), and light enough for a Pi 3B: plain fetch + one WebSocket
     + self-hosted fonts, no framework. */
  @font-face { font-family: Disp;  src: url(/tv/fonts/shippori-mincho-600.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: Kanji; src: url(/tv/fonts/shippori-kanji.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: Plex;  src: url(/tv/fonts/ibm-plex-sans-400.woff2) format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: Plex;  src: url(/tv/fonts/ibm-plex-sans-600.woff2) format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: Plex;  src: url(/tv/fonts/ibm-plex-sans-700.woff2) format('woff2'); font-weight: 700; font-display: swap; }
  @font-face { font-family: Mono;  src: url(/tv/fonts/ibm-plex-mono-500.woff2) format('woff2'); font-weight: 500; font-display: swap; }
  :root {
    --s0:#14120f; --s1:#1b1915; --s2:#221f1a;
    --hair:#2f2a23; --hair2:#3c362e;
    --ink:#ece6d8; --ink2:#c4bcab; --mute:#a39a88; --faint:#6f685b;
    --shu:#e0604f; --shu-dim:rgba(224,96,79,.12);
    --matcha:rgb(163,193,149);
    --gap: clamp(40px,4vw,84px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(75% 60% at 82% 6%, rgba(224,96,79,.045), rgba(224,96,79,0) 55%),
      radial-gradient(120% 120% at 55% 0%, #1b1813 0%, #141210 55%, #100e0b 100%);
    color: var(--ink);
    font: 400 20px/1.5 Plex, "Segoe UI", system-ui, sans-serif;
    overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  #frame { position: fixed; inset: 0; padding: clamp(34px,3.4vw,70px) clamp(40px,4vw,88px);
    display: flex; flex-direction: column;
    transition: transform 4s ease-in-out, filter 3s ease; will-change: transform; }
  body.night #frame { filter: brightness(0.46) saturate(0.82); }

  /* Masthead */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;
    padding-bottom: clamp(16px,1.6vw,26px); border-bottom: 1.5px solid var(--hair2); }
  .brand { font: 600 clamp(26px,2.5vw,46px) Disp, serif; letter-spacing: .01em; line-height: 1; }
  .brand .kanji { font-family: Kanji, serif; color: var(--shu); margin-left: .35em; }
  .mast-right { display: flex; align-items: flex-end; gap: clamp(26px,2.6vw,52px); }
  .clock { text-align: right; }
  .clock .t { font: 600 clamp(30px,3vw,56px) Plex; line-height: .9; letter-spacing: -.01em; }
  .clock .t .ap { font: 500 clamp(13px,1.2vw,20px) Mono; color: var(--mute); margin-left: .3em; }
  .clock .d { font: 500 clamp(12px,1.1vw,18px) Mono; color: var(--mute); letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }
  .wx { display: flex; align-items: flex-end; gap: 12px; text-align: right; }
  .wx .g { font-size: clamp(26px,2.6vw,44px); line-height: 1; }
  .wx .t { font: 600 clamp(26px,2.6vw,46px) Plex; line-height: .9; }
  .wx .hl { font: 500 clamp(11px,1vw,17px) Mono; color: var(--mute); margin-top: 8px; }
  .wx .loc { font-size: clamp(11px,1vw,16px); color: var(--faint); margin-top: 3px; }

  /* Rotating stage */
  #stage { position: relative; flex: 1; margin-top: clamp(26px,2.8vw,50px); }
  .scene { position: absolute; inset: 0; opacity: 0; visibility: hidden;
    transition: opacity 1s ease, visibility 1s; display: grid; gap: var(--gap); align-content: start; }
  .scene.on { opacity: 1; visibility: visible; }
  .cols2 { grid-template-columns: 1fr 1fr; }

  /* Section kicker (shu, uppercase, tracked) + optional meta */
  .khead { display: flex; align-items: baseline; justify-content: space-between; gap: 20px;
    margin-bottom: clamp(16px,1.6vw,26px); }
  .kicker { color: var(--shu); font: 600 clamp(13px,1.15vw,19px) Mono; letter-spacing: .22em; text-transform: uppercase; }
  .kmeta { color: var(--faint); font: 500 clamp(12px,1.1vw,18px) Mono; letter-spacing: .06em; }
  .col { border-left: 1.5px solid var(--hair); padding-left: var(--gap); }
  .col:first-child { border-left: 0; padding-left: 0; }

  /* Headline sentence (Shippori serif) — the MC signature flourish */
  .headline { font: 600 clamp(32px,3.6vw,72px)/1.08 Disp, serif; letter-spacing: -.01em; color: var(--ink);
    margin-bottom: clamp(28px,3vw,56px); max-width: 24ch; }
  .headline .q { color: var(--shu); }

  /* Tonight's dinner */
  .meal { font: 600 clamp(32px,3.6vw,74px)/1.04 Disp, serif; letter-spacing: -.01em; margin-top: 14px; }
  .meal.none { color: var(--faint); font-weight: 400; font-size: clamp(26px,2.8vw,48px); }

  /* Event rows */
  .ev { display: flex; align-items: baseline; gap: 18px; padding: clamp(12px,1.2vw,19px) 0; border-bottom: 1px solid var(--hair); }
  .ev:last-child { border-bottom: 0; }
  .ev .when { min-width: clamp(90px,9vw,160px); color: var(--mute); font: 500 clamp(15px,1.5vw,26px) Mono; }
  .ev .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; align-self: center; box-shadow: 0 0 9px currentColor; }
  .ev .title { font-size: clamp(19px,1.9vw,33px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev .loc { color: var(--faint); font: 400 clamp(13px,1.2vw,20px) Mono; margin-left: auto; white-space: nowrap; }
  .dayhdr { color: var(--mute); font: 600 clamp(13px,1.2vw,20px) Mono; letter-spacing: .12em; text-transform: uppercase;
    margin: clamp(18px,1.8vw,28px) 0 2px; }
  .daygroup:first-child .dayhdr { margin-top: 0; }

  /* Chores — per person, listed (not just a bar) */
  .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--gap) clamp(40px,4vw,84px); align-content: start; }
  .pers { border-top: 1.5px solid var(--hair2); padding-top: clamp(14px,1.4vw,22px); }
  .pers .top { display: flex; align-items: baseline; gap: 13px; }
  .pers .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; box-shadow: 0 0 9px currentColor; align-self: center; }
  .pers .name { font-size: clamp(23px,2.2vw,40px); font-weight: 600; }
  .pers .tally { margin-left: auto; font: 500 clamp(14px,1.3vw,23px) Mono; color: var(--mute); }
  .pers .tally b { color: var(--ink); }
  .pers .streak { color: var(--mute); font: 500 clamp(14px,1.3vw,22px) Mono; margin-left: 14px; }
  .chore { display: flex; align-items: baseline; gap: 14px; padding: clamp(8px,.8vw,13px) 0; }
  .chore .ck { font: 500 clamp(15px,1.4vw,24px) Mono; width: 1.4em; flex: none; }
  .chore.done .ck { color: var(--matcha); }
  .chore .ck.todo { color: var(--faint); }
  .chore .ct { font-size: clamp(17px,1.7vw,29px); }
  .chore.done .ct { color: var(--mute); }
  .chore .cp { margin-left: auto; color: var(--faint); font: 500 clamp(13px,1.2vw,20px) Mono; }
  .pers .none { color: var(--matcha); font-size: clamp(16px,1.5vw,26px); margin-top: 10px; }

  /* Meals week */
  .mday { display: flex; align-items: baseline; gap: 26px; padding: clamp(11px,1.1vw,17px) 0; border-bottom: 1px solid var(--hair); }
  .mday:last-child { border-bottom: 0; }
  .mday .d { min-width: clamp(140px,14vw,240px); color: var(--mute); font: 500 clamp(17px,1.7vw,29px) Mono; letter-spacing: .05em; text-transform: uppercase; }
  .mday .m { font-size: clamp(21px,2vw,37px); }
  .mday.today .d { color: var(--shu); }
  .mday.today .m { font-weight: 600; }
  .mday .m.none { color: var(--faint); }

  /* Notes + countdowns */
  .note { padding: clamp(6px,.6vw,10px) 0 clamp(14px,1.4vw,22px); border-bottom: 1px solid var(--hair); }
  .note:last-child { border-bottom: 0; }
  .note .tx { font-size: clamp(19px,1.9vw,33px); border-left: 3px solid var(--gray); padding-left: 18px; }
  .note .by { color: var(--mute); font: 400 clamp(13px,1.2vw,20px) Mono; margin: 8px 0 0 21px; }
  .cd { display: flex; align-items: baseline; gap: 20px; padding: clamp(13px,1.3vw,21px) 0; border-bottom: 1px solid var(--hair); }
  .cd:last-child { border-bottom: 0; }
  .cd .n { font: 600 clamp(34px,3.4vw,62px) Plex; min-width: clamp(80px,8vw,140px); color: var(--shu); line-height: 1; }
  .cd .n small { font: 500 .32em Mono; color: var(--mute); display: block; letter-spacing: .14em; text-transform: uppercase; margin-top: 6px; }
  .cd .t { font-size: clamp(19px,1.9vw,33px); }
  .cd .t .sub { color: var(--mute); font: 400 clamp(13px,1.2vw,20px) Mono; }

  .empty { color: var(--faint); font: 600 clamp(19px,1.9vw,32px) Disp, serif; }

  footer { margin-top: clamp(16px,1.6vw,24px); padding-top: clamp(12px,1.2vw,18px); border-top: 1px solid var(--hair);
    display: flex; justify-content: space-between; color: var(--faint); font: 500 clamp(11px,1vw,16px) Mono; letter-spacing: .08em; }
  footer .dotline { display: flex; align-items: center; gap: 8px; }
  #conn { width: 7px; height: 7px; border-radius: 50%; background: var(--hair2); transition: background .4s; }
  #conn.live { background: var(--matcha); }
</style>
</head>
<body>
  <div id="frame">
    <header>
      <div class="brand">Homebase<span class="kanji">家族</span></div>
      <div class="mast-right">
        <div class="clock"><div class="t" id="time">—<span class="ap" id="ampm"></span></div><div class="d" id="date"></div></div>
        <div class="wx" id="wx"></div>
      </div>
    </header>
    <div id="stage"></div>
    <footer>
      <span id="foot">Homebase</span>
      <span class="dotline"><span id="connword">live</span><span id="conn"></span></span>
    </footer>
  </div>

<script>
"use strict";
(function () {
  // Person/section colours → a Japanese-inspired palette (the -400 "on dark" variants).
  var HUE = { blue:'132,160,210', green:'163,193,149', teal:'144,198,196', purple:'167,152,190',
    orange:'224,161,118', pink:'197,144,150', red:'224,126,118', amber:'223,186,119', gray:'192,186,175' };
  var col = function (c) { return 'rgb(' + (HUE[c] || HUE.gray) + ')'; };
  var el = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };

  function wxGlyph(code) {
    if (code === 0) return ['☀️','Clear'];
    if (code <= 2) return ['🌤️','Partly cloudy'];
    if (code === 3) return ['☁️','Cloudy'];
    if (code <= 48) return ['🌫️','Fog'];
    if (code <= 57) return ['🌦️','Drizzle'];
    if (code <= 67) return ['🌧️','Rain'];
    if (code <= 77) return ['🌨️','Snow'];
    if (code <= 82) return ['🌧️','Showers'];
    if (code <= 86) return ['🌨️','Snow'];
    if (code <= 99) return ['⛈️','Storm'];
    return ['🌡️',''];
  }

  var WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function ymd(s) { return new Date(s + 'T12:00:00'); }        // noon: DST-safe
  function addYmd(s, n) { return new Date(Date.parse(s + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10); }
  function evTime(ev) {
    if (ev.all_day) return 'All day';
    var d = new Date(ev.start), h = d.getHours(), m = d.getMinutes();
    return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h >= 12 ? 'pm' : 'am');
  }
  function dayLabel(dateStr, today) {
    if (dateStr === today) return 'Today';
    var d = ymd(dateStr);
    if ((Date.parse(dateStr + 'T00:00:00Z') - Date.parse(today + 'T00:00:00Z')) / 864e5 === 1) return 'Tomorrow';
    return WD[d.getDay()] + ' · ' + MO[d.getMonth()] + ' ' + d.getDate();
  }

  function tickClock() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    el('time').firstChild.nodeValue = (h % 12 || 12) + ':' + String(m).padStart(2, '0');
    el('ampm').textContent = h >= 12 ? 'PM' : 'AM';
    el('date').textContent = WD[d.getDay()] + ' · ' + MO[d.getMonth()] + ' ' + d.getDate();
    el('foot').textContent = 'Homebase · updated ' + (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h >= 12 ? ' pm' : ' am');
    var mins = h * 60 + m;
    document.body.classList.toggle('night', mins >= 22 * 60 + 30 || mins < 6 * 60 + 30);
  }

  var SHIFTS = [[0,0],[-10,-6],[9,-8],[-7,9],[11,6],[6,-10]];
  var si = 0;
  function nudge() { si = (si + 1) % SHIFTS.length; el('frame').style.transform = 'translate(' + SHIFTS[si][0] + 'px,' + SHIFTS[si][1] + 'px)'; }

  function weatherStrip(w, loc) {
    if (!w) { el('wx').innerHTML = ''; return; }
    var g = wxGlyph(w.code), td = (w.daily && w.daily[0]) || {};
    el('wx').innerHTML = '<div class="g">' + g[0] + '</div>' +
      '<div><div class="t">' + w.temp + '°</div>' +
      '<div class="hl">' + (td.hi != null ? 'H ' + td.hi + '°  L ' + td.lo + '°' : esc(g[1])) + '</div>' +
      (loc ? '<div class="loc">' + esc(loc) + '</div>' : '') + '</div>';
  }

  function evRow(ev, people) {
    var p = people[ev.person_id];
    return '<div class="ev">' +
      '<span class="when">' + esc(evTime(ev)) + '</span>' +
      '<span class="dot" style="color:' + (p ? col(p.color) : '#777') + ';background:currentColor"></span>' +
      '<span class="title">' + esc(ev.title) + '</span>' +
      (ev.location ? '<span class="loc">' + esc(ev.location) + '</span>' : '') + '</div>';
  }

  // The serif headline sentence — a couple of factual clauses about today (MC signature).
  function headline(d) {
    var c = [];
    var meal = (d.meals || []).find(function (m) { return m.date === d.now.date; });
    if (meal) c.push(esc(meal.title) + ' for dinner.');
    var timed = (d.events.today || []).filter(function (e) { return !e.all_day; });
    if (timed.length) c.push(esc(timed[0].title) + ' at <span class="q">' + esc(evTime(timed[0])) + '</span>.');
    else if ((d.events.today || []).length) c.push(esc(d.events.today[0].title) + ' today.');
    var tot = 0, done = 0;
    (d.chores || []).forEach(function (p) { tot += p.total; done += p.done; });
    if (tot > 0) c.push(done === tot ? 'All chores <span class="q">done</span>.' : '<span class="q">' + (tot - done) + '</span> chores still to do.');
    return c.slice(0, 3).join(' ') || 'A quiet day on the board.';
  }

  // ---- scenes ----
  function sceneToday(d, people) {
    var meal = (d.meals || []).find(function (m) { return m.date === d.now.date; });
    var today = d.events.today || [];
    var list = (today.length ? today : (d.events.upcoming || [])).slice(0, 5)
      .map(function (e) { return evRow(e, people); }).join('') || '<div class="empty">Nothing on the calendar.</div>';
    return '<div class="scene" style="grid-template-rows:auto 1fr">' +
      '<div class="headline">' + headline(d) + '</div>' +
      '<div class="cols2" style="display:grid;gap:var(--gap)">' +
        '<div class="col"><div class="khead"><span class="kicker">Tonight\'s dinner</span></div>' +
          (meal ? '<div class="meal">' + esc(meal.title) + '</div>' : '<div class="meal none">Nothing planned yet</div>') + '</div>' +
        '<div class="col"><div class="khead"><span class="kicker">' + (today.length ? 'Today' : 'Coming up') + '</span></div>' + list + '</div>' +
      '</div></div>';
  }

  function sceneChores(d, people) {
    if (!d.chores || !d.chores.length) return null;
    var cents = d.settings.cents_per_point || 0;
    var cards = d.chores.map(function (p) {
      var items = (p.items || []).map(function (c) {
        return '<div class="chore' + (c.done ? ' done' : '') + '">' +
          '<span class="ck' + (c.done ? '' : ' todo') + '">' + (c.done ? '✓' : '○') + '</span>' +
          '<span class="ct">' + (c.icon ? esc(c.icon) + ' ' : '') + esc(c.title) + '</span>' +
          (c.points ? '<span class="cp">' + c.points + '</span>' : '') + '</div>';
      }).join('');
      var money = cents > 0 ? '  ·  $' + ((p.points * cents) / 100).toFixed(2) : '';
      return '<div class="pers">' +
        '<div class="top"><span class="dot" style="color:' + col(p.color) + ';background:currentColor"></span>' +
          '<span class="name">' + esc(p.name) + '</span>' +
          (p.streak > 0 ? '<span class="streak">🔥 ' + p.streak + '</span>' : '') +
          '<span class="tally"><b>' + p.points + '</b> pts' + money + '</span></div>' +
        (items || '<div class="none">No chores today ✓</div>') + '</div>';
    }).join('');
    return '<div class="scene" style="grid-template-rows:auto 1fr">' +
      '<div class="khead"><span class="kicker">Chores · Today</span></div>' +
      '<div class="people">' + cards + '</div></div>';
  }

  function sceneCalendar(d, people) {
    var today = (d.events.today || []).map(function (e) { return evRow(e, people); }).join('') || '<div class="empty">A clear day.</div>';
    var groups = {}, order = [];
    (d.events.upcoming || []).forEach(function (e) { var k = e.all_day ? String(e.start).slice(0, 10) : (function (x) { return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); })(new Date(e.start)); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(e); });
    var budget = 8, up = '';
    for (var gi = 0; gi < order.length && budget > 1; gi++) {
      var evs = groups[order[gi]].slice(0, budget - 1); budget -= 1 + evs.length;
      up += '<div class="daygroup"><div class="dayhdr">' + esc(dayLabel(order[gi], d.now.date)) + '</div>' +
        evs.map(function (e) { return evRow(e, people); }).join('') + '</div>';
    }
    if (!up) up = '<div class="empty">Nothing coming up.</div>';
    return '<div class="scene cols2">' +
      '<div class="col"><div class="khead"><span class="kicker">Today</span></div>' + today + '</div>' +
      '<div class="col"><div class="khead"><span class="kicker">Coming up</span></div>' + up + '</div></div>';
  }

  function sceneMeals(d) {
    if (!d.meals || !d.meals.length) return null;
    var byDate = {}; d.meals.forEach(function (m) { byDate[m.date] = m.title; });
    var rows = '';
    for (var i = 0; i < 7; i++) {
      var key = addYmd(d.now.date, i), title = byDate[key];
      rows += '<div class="mday' + (i === 0 ? ' today' : '') + '"><span class="d">' + (i === 0 ? 'Today' : WD[ymd(key).getDay()]) + '</span>' +
        '<span class="m' + (title ? '' : ' none') + '">' + (title ? esc(title) : '—') + '</span></div>';
    }
    return '<div class="scene" style="grid-template-rows:auto 1fr;gap:clamp(14px,1.5vw,24px)"><div class="khead"><span class="kicker">This week\'s dinners</span></div><div>' + rows + '</div></div>';
  }

  function sceneNotes(d, people) {
    var hasN = d.notes && d.notes.length, hasC = (d.countdowns && d.countdowns.length) || (d.birthdays && d.birthdays.length);
    if (!hasN && !hasC) return null;
    var notes = hasN ? d.notes.map(function (n) {
      var p = people[n.person_id];
      return '<div class="note"><div class="tx" style="border-left-color:' + (p ? col(p.color) : '#777') + '">' + esc(n.text) + '</div>' +
        (p ? '<div class="by">— ' + esc(p.name) + '</div>' : '') + '</div>';
    }).join('') : '<div class="empty">No announcements.</div>';
    var cds = (d.countdowns || []).map(function (c) {
      return '<div class="cd"><span class="n">' + c.days + '<small>' + (c.days === 1 ? 'day' : 'days') + '</small></span>' +
        '<span class="t">' + (c.icon ? esc(c.icon) + ' ' : '') + esc(c.title) + '</span></div>';
    });
    var bds = (d.birthdays || []).map(function (b) {
      return '<div class="cd"><span class="n" style="color:' + col(b.color) + '">' + b.days + '<small>days</small></span>' +
        '<span class="t">🎂 ' + esc(b.name) + '<span class="sub"> · birthday</span></span></div>';
    });
    var right = cds.concat(bds).join('') || '<div class="empty">Nothing upcoming.</div>';
    return '<div class="scene cols2">' +
      '<div class="col"><div class="khead"><span class="kicker">Family notes</span></div>' + notes + '</div>' +
      '<div class="col"><div class="khead"><span class="kicker">Countdowns</span></div>' + right + '</div></div>';
  }

  // ---- rotation ----
  var PIN = new URLSearchParams(location.search).get('pin');
  var DATA = null, scenes = [], idx = 0, rotTimer = null;
  var DWELL = 16000, DWELL_HERO = 22000;

  function build() {
    if (!DATA) return;
    var people = {}; (DATA.people || []).forEach(function (p) { people[p.id] = p; });
    weatherStrip(DATA.weather, DATA.settings && DATA.settings.location_name);
    var defs = [
      ['today', sceneToday(DATA, people)],
      ['chores', sceneChores(DATA, people)],
      ['calendar', sceneCalendar(DATA, people)],
      ['meals', sceneMeals(DATA)],
      ['notes', sceneNotes(DATA, people)],
    ].filter(function (s) { return s[1]; });
    el('stage').innerHTML = defs.map(function (s) { return s[1].replace('<div class="scene', '<div data-k="' + s[0] + '" class="scene'); }).join('');
    scenes = Array.prototype.slice.call(el('stage').children);
    if (PIN) { var pi = scenes.findIndex(function (s) { return s.getAttribute('data-k') === PIN; }); idx = pi >= 0 ? pi : 0; }
    if (idx >= scenes.length) idx = 0;
    showScene(idx);
  }
  function showScene(i) {
    if (!scenes.length) return;
    scenes.forEach(function (s, j) { s.classList.toggle('on', j === i); });
    idx = i; clearTimeout(rotTimer);
    if (PIN) return;
    var hero = scenes[i].getAttribute('data-k') === 'today';
    rotTimer = setTimeout(function () { showScene((idx + 1) % scenes.length); }, hero ? DWELL_HERO : DWELL);
  }

  var refetchTimer = null;
  function load() {
    fetch('/api/tv/ambient', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { DATA = d; build(); })
      .catch(function () {});
  }
  function scheduleRefetch() { clearTimeout(refetchTimer); refetchTimer = setTimeout(load, 800); }

  function connect() {
    var proto = location.protocol === 'https:' ? 'wss' : 'ws', ws;
    try { ws = new WebSocket(proto + '://' + location.host + '/ws'); } catch (e) { return; }
    ws.onopen = function () { el('conn').classList.add('live'); el('connword').textContent = 'live'; load(); };
    ws.onmessage = function (ev) { var m; try { m = JSON.parse(ev.data); } catch (e) { return; } if (m && m.type === 'changed') scheduleRefetch(); };
    ws.onclose = function () { el('conn').classList.remove('live'); el('connword').textContent = 'reconnecting'; setTimeout(connect, 5000); };
    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }

  tickClock(); setInterval(tickClock, 10000);
  nudge(); setInterval(nudge, 40000);
  load(); connect();
  setInterval(load, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
